[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origo"
version = "0.1.0"
description = "Stack traces for bad AI outputs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
origo = "origo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
